<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Analyst | Woven Health Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">

<!-- Libraries (pinned versions) -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  /* ---------- Woven Health Collective tokens (sampled from the logo) ---------- */
  :root {
    --navy: #253746;
    --navy-deep: #192e3f;
    --gray: #9ea2a2;
    --coral: #ff585d;
    --plum: #840b55;
    --mint: #2cd5c4;
    --teal: #007d8a;
    --sky: #009cde;
    --blue: #005687;
    --gold: #ffb81c;
    --tan: #c09c83;

    --bg: #f3f5f6;
    --surface: #ffffff;
    --line: #e1e5e8;
    --text: #253746;
    --muted: #5d6973;

    --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
    --sidebar: 280px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }

  .app { display: flex; height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 16px 16px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .logo { display: block; width: 150px; margin: 0 auto 24px; }
  .logo img { width: 100%; height: auto; display: block; }

  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    padding: 11px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .new-chat:hover { background: var(--navy-deep); }

  .history-heading {
    margin: 24px 8px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .history { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .history li { display: flex; align-items: center; border-radius: 8px; }
  .history li:hover, .history li.active { background: #edf1f3; }
  .history li.active { box-shadow: inset 3px 0 0 var(--teal); }
  .history .open {
    flex: 1; min-width: 0;
    text-align: left;
    background: none; border: 0;
    padding: 9px 10px;
    font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .history .del {
    background: none; border: 0; cursor: pointer;
    color: var(--muted);
    width: 30px; height: 30px; border-radius: 6px;
    opacity: 0;
  }
  .history li:hover .del, .history .del:focus-visible { opacity: 1; }
  .history .del:hover { color: var(--coral); }
  .history-empty { padding: 8px 10px; font-size: 14px; color: var(--muted); }

  .account {
    border-top: 1px solid var(--line);
    padding: 14px 8px 0;
    font-size: 14px;
    color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .account strong { color: var(--text); font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-btn { background: none; border: 0; color: var(--teal); font-weight: 600; cursor: pointer; padding: 4px; }
  .link-btn:hover { text-decoration: underline; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* The woven ribbon: the one decorative element, built from the logo's eight strands */
  .ribbon {
    height: 5px; flex-shrink: 0;
    background: linear-gradient(90deg,
      var(--gold) 0 12.5%, var(--tan) 12.5% 25%, var(--coral) 25% 37.5%, var(--plum) 37.5% 50%,
      var(--mint) 50% 62.5%, var(--teal) 62.5% 75%, var(--sky) 75% 87.5%, var(--blue) 87.5% 100%);
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .menu-btn { display: none; background: none; border: 0; cursor: pointer; padding: 6px; }
  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
  .status.live .dot { background: var(--mint); }
  .status.demo .dot { background: var(--gold); }

  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 800px; margin: 0 auto; padding: 32px 24px 24px; }

  /* Welcome */
  .welcome { padding-top: 6vh; }
  .welcome h2 {
    font-size: clamp(30px, 4.4vw, 44px);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    max-width: 16ch;
  }
  .welcome p { color: var(--muted); margin: 0 0 32px; max-width: 56ch; }
  .starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .starter {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--c, var(--teal));
    border-radius: 6px 12px 12px 6px;
    padding: 14px 16px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.4;
  }
  .starter:hover { border-color: var(--c, var(--teal)); border-left-width: 5px; }

  /* Messages */
  .msg { margin-bottom: 28px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--navy); color: #fff;
    padding: 11px 16px;
    border-radius: 16px 16px 4px 16px;
    max-width: 80%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.agent .who {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px;
  }
  .msg.agent .who .mark { width: 18px; height: 18px; }
  .answer { overflow-wrap: anywhere; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer p, .answer ul, .answer ol { margin: 0 0 12px; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; margin: 18px 0 8px; }
  .answer code { font-family: var(--mono); font-size: 0.88em; background: #e8edf0; padding: 1px 5px; border-radius: 4px; }
  .answer pre { background: var(--navy-deep); color: #e8eef2; padding: 14px; border-radius: 8px; overflow-x: auto; }
  .answer pre code { background: none; padding: 0; color: inherit; }
  .msg.error .answer { border-left: 4px solid var(--coral); padding: 10px 14px; background: #fff3f3; border-radius: 0 8px 8px 0; }

  /* Results: table + chart */
  .result { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 14px 0; overflow: hidden; }
  .result-bar { display: flex; align-items: center; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(37,55,70,.15); }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .result-bar .spacer { flex: 1; }
  .tool-btn { border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--teal); padding: 5px 8px; cursor: pointer; border-radius: 6px; }
  .tool-btn:hover { background: #e9f4f5; }
  .table-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  .result table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .result th, .result td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .result th { position: sticky; top: 0; background: #f7f9fa; font-weight: 600; }
  .result td.num, .result th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .result tr:last-child td { border-bottom: 0; }
  .chart-box { height: 320px; padding: 16px; }

  /* Query disclosure */
  .query { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .query summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--teal); list-style: none; display: flex; align-items: center; gap: 8px; }
  .query summary::-webkit-details-marker { display: none; }
  .query summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
  .query[open] summary::before { transform: rotate(45deg); }
  .query .q-body { position: relative; padding: 0 14px 14px; }
  .query pre { margin: 0; background: var(--navy-deep); color: #e8eef2; padding: 14px; border-radius: 8px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
  .query .copy { position: absolute; top: 8px; right: 22px; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .query .copy:hover { background: rgba(255,255,255,.22); }

  /* Thinking indicator: strands weaving */
  .weaving { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .strands { display: flex; gap: 3px; height: 20px; align-items: center; }
  .strands i { width: 5px; height: 20px; border-radius: 3px; transform: skewX(-20deg); animation: weave 1.2s ease-in-out infinite; }
  .strands i:nth-child(1) { background: var(--gold); }
  .strands i:nth-child(2) { background: var(--coral); animation-delay: .12s; }
  .strands i:nth-child(3) { background: var(--plum); animation-delay: .24s; }
  .strands i:nth-child(4) { background: var(--mint); animation-delay: .36s; }
  .strands i:nth-child(5) { background: var(--teal); animation-delay: .48s; }
  .strands i:nth-child(6) { background: var(--sky); animation-delay: .6s; }
  @keyframes weave { 0%,100% { transform: skewX(-20deg) scaleY(.45); opacity: .5; } 50% { transform: skewX(-20deg) scaleY(1); opacity: 1; } }

  /* Composer */
  .composer-wrap { padding: 12px 24px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .composer {
    max-width: 800px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 8px 8px 8px 16px;
  }
  .composer:focus-within { border-color: var(--teal); }
  .composer textarea {
    flex: 1; border: 0; outline: none; resize: none; background: none;
    padding: 8px 0; max-height: 180px; line-height: 1.45;
  }
  .send {
    width: 40px; height: 40px; flex-shrink: 0;
    border: 0; border-radius: 10px;
    background: var(--teal); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .send:hover { background: #006a75; }
  .send:disabled { background: var(--gray); cursor: not-allowed; }
  .hint { max-width: 800px; margin: 8px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

  .banner { background: #fff8e6; border-bottom: 1px solid #f3dfa8; padding: 10px 24px; font-size: 14px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Mobile ---------- */
  .scrim { display: none; }
  @media (max-width: 820px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(37,55,70,.18); }
    .app.nav-open .sidebar { transform: none; }
    .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(25,46,63,.35); z-index: 10; }
    .menu-btn { display: block; }
    .topbar { padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .thread { padding: 24px 16px; }
    .composer-wrap { padding-left: 12px; padding-right: 12px; }
    .starters { grid-template-columns: 1fr; }
    .history .del { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .strands i { animation: none; opacity: .9; }
    .sidebar { transition: none; }
  }
</style>
</head>

          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 15V3M3.5 8.5L9 3l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
/* =====================================================================
   CONFIGURATION — fill these in to connect to your Fabric Data Agent
   ===================================================================== */
const CONFIG = {
  // true = runs with sample answers so you can preview the interface.
  // Set to false once the values below are filled in.
  DEMO_MODE: true,

  // From Fabric: open your data agent > Settings > Publishing > "Published URL"
  // Looks like: https://api.fabric.microsoft.com/v1/workspaces/<workspace-id>/dataagents/<agent-id>/aiassistant/openai
  AGENT_URL: "PASTE_PUBLISHED_URL_HERE",
  API_VERSION: "2024-05-01-preview",

  // From your Entra ID app registration (Single-page application platform)
  CLIENT_ID: "PASTE_CLIENT_ID_HERE",
  TENANT_ID: "PASTE_TENANT_ID_HERE",
  REDIRECT_URI: "",   // leave blank to use this page's own URL
  SCOPES: ["https://api.fabric.microsoft.com/.default"],

  AGENT_NAME: "Data Analyst",
  TIMEOUT_MS: 180000,

  STARTER_QUESTIONS: [
    "What's the average cost per event for live programs?",
    "How many completed events did we have in September?",
    "Compare spend on virtual vs live programs by bureau.",
    "What's the projected total cost for the upcoming events?"
  ]
};

/* ===================================================================== */

const STRANDS = ["#007d8a", "#ff585d", "#005687", "#ffb81c", "#840b55", "#2cd5c4", "#009cde", "#c09c83"];
const STORE_KEY = "woven-data-agent-chats";
const $ = (id) => document.getElementById(id);

let chats = loadChats();
let activeId = null;
let busy = false;
let msalApp = null;
let account = null;
let assistantId = null;

/* ---------- Storage ---------- */
function loadChats() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
}
function saveChats() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(chats.slice(0, 50))); } catch {}
}
function activeChat() { return chats.find(c => c.id === activeId) || null; }

/* ---------- Sidebar ---------- */
function renderHistory() {
  const ul = $("history");
  ul.innerHTML = "";
  if (!chats.length) {
    ul.innerHTML = '<li class="history-empty">Your chats will appear here.</li>';
    return;
  }
  for (const c of chats) {
    const li = document.createElement("li");
    if (c.id === activeId) li.className = "active";
    const open = document.createElement("button");
    open.className = "open";
    open.textContent = c.title;
    open.title = c.title;
    open.onclick = () => { openChat(c.id); closeNav(); };
    const del = document.createElement("button");
    del.className = "del";
    del.setAttribute("aria-label", `Delete chat: ${c.title}`);
    del.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    del.onclick = () => deleteChat(c.id);
    li.append(open, del);
    ul.appendChild(li);
  }
}

function renderAccount() {
  const el = $("account");
  if (CONFIG.DEMO_MODE) {
    el.innerHTML = '<div><strong>Demo mode</strong>Sample answers only</div>';
  } else if (account) {
    el.innerHTML = "";
    const who = document.createElement("div");
    const name = document.createElement("strong");
    name.textContent = account.name || account.username;
    who.append(name, document.createTextNode("Signed in"));
    const out = document.createElement("button");
    out.className = "link-btn"; out.textContent = "Sign out";
    out.onclick = signOut;
    el.append(who, out);
  } else {
    el.innerHTML = "";
    const who = document.createElement("div");
    who.textContent = "Not signed in";
    const btn = document.createElement("button");
    btn.className = "link-btn"; btn.textContent = "Sign in";
    btn.onclick = () => signIn().catch(e => showBanner(e.message));
    el.append(who, btn);
  }
  const st = $("status");
  st.className = "status " + (CONFIG.DEMO_MODE ? "demo" : account ? "live" : "");
  $("statusText").textContent = CONFIG.DEMO_MODE ? "Demo data" : account ? "Connected to Fabric" : "Sign in to connect";
}

function openNav() { $("app").classList.add("nav-open"); }
function closeNav() { $("app").classList.remove("nav-open"); }

/* ---------- Chat lifecycle ---------- */
function newChat() {
  activeId = null;
  $("chatTitle").textContent = CONFIG.AGENT_NAME;
  renderThread();
  renderHistory();
  closeNav();
  $("input").focus();
}
function openChat(id) {
  activeId = id;
  const c = activeChat();
  $("chatTitle").textContent = c ? c.title : CONFIG.AGENT_NAME;
  renderThread();
  renderHistory();
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (activeId === id) newChat(); else renderHistory();
}

/* ---------- Thread rendering ---------- */
function renderThread() {
  const t = $("thread");
  t.innerHTML = "";
  const c = activeChat();
  if (!c || !c.messages.length) { t.appendChild(welcome()); return; }
  for (const m of c.messages) t.appendChild(messageEl(m));
  scrollDown();
}

function welcome() {
  const w = document.createElement("section");
  w.className = "welcome";
  w.innerHTML = `<h2>What would you like to know?</h2>
    <p>Ask in plain language. ${escapeHtml(CONFIG.AGENT_NAME)} queries your Fabric data, answers with tables and charts, and shows you the exact query it ran.</p>`;
  const grid = document.createElement("div");
  grid.className = "starters";
  CONFIG.STARTER_QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "starter";
    b.style.setProperty("--c", STRANDS[i % STRANDS.length]);
    b.textContent = q;
    b.onclick = () => send(q);
    grid.appendChild(b);
  });
  w.appendChild(grid);
  return w;
}

function messageEl(m) {
  const wrap = document.createElement("div");
  if (m.role === "user") {
    wrap.className = "msg user";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = m.content;
    wrap.appendChild(b);
    return wrap;
  }
  wrap.className = "msg agent" + (m.error ? " error" : "");
  wrap.innerHTML = `<div class="who">${markSvg()}<span>${escapeHtml(CONFIG.AGENT_NAME)}</span></div>`;
  const ans = document.createElement("div");
  ans.className = "answer";
  ans.innerHTML = renderMarkdown(m.content);
  enhanceTables(ans);
  wrap.appendChild(ans);
  for (const q of (m.queries || [])) wrap.appendChild(queryEl(q));
  return wrap;
}

function thinkingEl() {
  const wrap = document.createElement("div");
  wrap.className = "msg agent";
  wrap.id = "thinking";
  wrap.innerHTML = `<div class="weaving"><span class="strands" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="thinkingText">Analyzing your data…</span></div>`;
  return wrap;
}

function queryEl(q) {
  const d = document.createElement("details");
  d.className = "query";
  const s = document.createElement("summary");
  s.textContent = `View ${q.lang} query`;
  const body = document.createElement("div");
  body.className = "q-body";
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  code.textContent = q.code;
  pre.appendChild(code);
  const copy = document.createElement("button");
  copy.className = "copy"; copy.type = "button"; copy.textContent = "Copy";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(q.code); copy.textContent = "Copied"; }
    catch { copy.textContent = "Select and copy manually"; }
    setTimeout(() => (copy.textContent = "Copy"), 1600);
  };
  body.append(pre, copy);
  d.append(s, body);
  return d;
}

function markSvg() {
  return `<svg class="mark" viewBox="0 0 18 18" aria-hidden="true">
    <rect x="1" y="2" width="4" height="14" rx="2" fill="#ffb81c" transform="skewX(-12)"/>
    <rect x="6" y="2" width="4" height="14" rx="2" fill="#ff585d" transform="skewX(-12)"/>
    <rect x="11" y="2" width="4" height="14" rx="2" fill="#2cd5c4" transform="skewX(-12)"/>
    <rect x="16" y="2" width="4" height="14" rx="2" fill="#009cde" transform="skewX(-12)"/></svg>`;
}

/* ---------- Markdown + results ---------- */
function renderMarkdown(text) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(text || "", { gfm: true, breaks: false }));
  }
  return `<p>${escapeHtml(text || "").replace(/\n/g, "<br>")}</p>`;
}

function parseNum(s) {
  if (s == null) return null;
  let t = String(s).trim().replace(/[$€£,%\s]/g, "");
  const neg = /^\(.*\)$/.test(t);
  t = t.replace(/[()]/g, "");
  if (t === "" || isNaN(t)) return null;
  return neg ? -parseFloat(t) : parseFloat(t);
}

function tableData(tbl) {
  const headers = [...tbl.querySelectorAll("thead th")].map(th => th.textContent.trim());
  const rows = [...tbl.querySelectorAll("tbody tr")].map(tr => [...tr.children].map(td => td.textContent.trim()));
  return { headers, rows };
}

function enhanceTables(container) {
  container.querySelectorAll("table").forEach((tbl) => {
    const { headers, rows } = tableData(tbl);
    if (!headers.length || !rows.length) return;

    const numericCols = headers.map((_, j) => j).filter(j => {
      if (j === 0) return false;
      const vals = rows.map(r => parseNum(r[j]));
      return vals.filter(v => v !== null).length >= Math.ceil(rows.length * 0.8);
    });
    numericCols.forEach(j => {
      tbl.querySelectorAll(`tr > :nth-child(${j + 1})`).forEach(cell => cell.classList.add("num"));
    });

    const wrap = document.createElement("div");
    wrap.className = "result";
    tbl.parentNode.insertBefore(wrap, tbl);

    const bar = document.createElement("div");
    bar.className = "result-bar";
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Result view");
    const tBtn = document.createElement("button");
    tBtn.type = "button"; tBtn.textContent = "Table"; tBtn.setAttribute("aria-pressed", "true");
    const cBtn = document.createElement("button");
    cBtn.type = "button"; cBtn.textContent = "Chart"; cBtn.setAttribute("aria-pressed", "false");
    const canChart = numericCols.length > 0 && rows.length > 1 && !!window.Chart;
    if (!canChart) { cBtn.disabled = true; cBtn.title = "No numeric columns to chart"; }
    seg.append(tBtn, cBtn);

    const dl = document.createElement("button");
    dl.className = "tool-btn"; dl.type = "button"; dl.textContent = "Download CSV";
    dl.onclick = () => downloadCsv(headers, rows);
    const spacer = document.createElement("span"); spacer.className = "spacer";
    bar.append(seg, spacer, dl);

    const scroller = document.createElement("div");
    scroller.className = "table-scroll";
    scroller.appendChild(tbl);

    const chartBox = document.createElement("div");
    chartBox.className = "chart-box";
    chartBox.hidden = true;
    const canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `Chart of ${headers.join(", ")}`);
    chartBox.appendChild(canvas);
    let chart = null;

    tBtn.onclick = () => {
      tBtn.setAttribute("aria-pressed", "true"); cBtn.setAttribute("aria-pressed", "false");
      scroller.hidden = false; chartBox.hidden = true;
    };
    cBtn.onclick = () => {
      cBtn.setAttribute("aria-pressed", "true"); tBtn.setAttribute("aria-pressed", "false");
      scroller.hidden = true; chartBox.hidden = false;
      if (!chart) chart = buildChart(canvas, headers, rows, numericCols);
    };

    wrap.append(bar, scroller, chartBox);
  });
}

function buildChart(canvas, headers, rows, numericCols) {
  const labels = rows.map(r => r[0]);
  const timeLike = rows.length > 3 && labels.every(l =>
    /\b(19|20)\d{2}\b|^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)|^q[1-4]\b|^\d{1,2}[\/-]\d{1,2}/i.test(l));
  const type = timeLike ? "line" : "bar";
  const cols = numericCols.slice(0, 4);
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = "#5d6973";
  return new Chart(canvas, {
    type,
    data: {
      labels,
      datasets: cols.map((j, k) => ({
        label: headers[j],
        data: rows.map(r => parseNum(r[j])),
        backgroundColor: STRANDS[k],
        borderColor: STRANDS[k],
        borderWidth: type === "line" ? 2.5 : 0,
        borderRadius: type === "bar" ? 4 : 0,
        tension: 0.3,
        pointRadius: type === "line" ? 3 : 0
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: cols.length > 1, position: "bottom" } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: "#e1e5e8" } }
      }
    }
  });
}

function downloadCsv(headers, rows) {
  const esc = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const csv = [headers, ...rows].map(r => r.map(esc).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url; a.download = "data-analyst-results.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Sending ---------- */
async function send(text) {
  const question = (text ?? $("input").value).trim();
  if (!question || busy) return;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";
  autosize();

  let c = activeChat();
  if (!c) {
    c = { id: crypto.randomUUID(), title: question.slice(0, 60), threadId: null, messages: [], created: Date.now() };
    chats.unshift(c);
    activeId = c.id;
    $("chatTitle").textContent = c.title;
    $("thread").innerHTML = "";
  } else {
    chats = [c, ...chats.filter(x => x.id !== c.id)];
  }
  const userMsg = { role: "user", content: question };
  c.messages.push(userMsg);
  saveChats();
  renderHistory();

  $("thread").appendChild(messageEl(userMsg));
  $("thread").appendChild(thinkingEl());
  scrollDown();

  let reply;
  try {
    const res = await askAgent(c, question);
    reply = { role: "agent", content: res.text, queries: res.queries };
  } catch (err) {
    console.error(err);
    reply = { role: "agent", content: err.message || String(err), error: true };
  }
  $("thinking")?.remove();
  c.messages.push(reply);
  saveChats();
  if (activeId === c.id) { $("thread").appendChild(messageEl(reply)); scrollDown(); }

  busy = false;
  $("send").disabled = false;
  $("input").focus();
}

function setThinking(text) { const el = $("thinkingText"); if (el) el.textContent = text; }

/* ---------- Fabric Data Agent (OpenAI Assistants-compatible endpoint) ---------- */
async function askAgent(chat, question) {
  if (CONFIG.DEMO_MODE) return demoAnswer(question);

  const aid = await ensureAssistant();
  if (!chat.threadId) {
    const thread = await api("/threads", "POST", {});
    chat.threadId = thread.id;
    saveChats();
  }
  const tid = chat.threadId;

  try {
    await api(`/threads/${tid}/messages`, "POST", { role: "user", content: question });
  } catch (e) {
    // Thread expired or was removed: start a fresh one and retry once.
    if (e.status === 404) {
      const thread = await api("/threads", "POST", {});
      chat.threadId = thread.id; saveChats();
      return askAgent(chat, question);
    }
    throw e;
  }

  let run = await api(`/threads/${tid}/runs`, "POST", { assistant_id: aid });
  const started = Date.now();
  while (["queued", "in_progress", "cancelling"].includes(run.status)) {
    if (Date.now() - started > CONFIG.TIMEOUT_MS) {
      throw new Error("The agent didn't finish within 3 minutes. Try a narrower question, such as one time period or one clinic.");
    }
    setThinking(run.status === "queued" ? "Waiting for the agent…" : "Querying your data…");
    await sleep(1500);
    run = await api(`/threads/${tid}/runs/${run.id}`);
  }
  if (run.status !== "completed") {
    const why = run.last_error?.message ? ` ${run.last_error.message}` : "";
    throw new Error(`The agent stopped with status "${run.status}".${why}`);
  }

  const list = await api(`/threads/${tid}/messages?order=desc&limit=20`);
  const all = (list.data || []).filter(m => m.role === "assistant");
  let mine = all.filter(m => m.run_id === run.id);
  if (!mine.length && all.length) mine = [all[0]];
  const text = mine.reverse()
    .flatMap(m => m.content || [])
    .filter(p => p.type === "text")
    .map(p => p.text?.value || "")
    .join("\n\n")
    .replace(/【[^】]*】/g, "");

  let queries = [];
  try {
    const steps = await api(`/threads/${tid}/runs/${run.id}/steps?order=asc&limit=50`);
    queries = extractQueries(steps.data || []);
  } catch (e) { console.warn("Could not load run steps", e); }

  return { text: text || "The agent finished but returned no text.", queries };
}

async function ensureAssistant() {
  if (assistantId) return assistantId;
  const a = await api("/assistants", "POST", { model: "not used" });
  assistantId = a.id;
  return assistantId;
}

async function api(path, method = "GET", body) {
  const token = await getToken();
  const sep = path.includes("?") ? "&" : "?";
  const url = `${CONFIG.AGENT_URL.replace(/\/$/, "")}${path}${sep}api-version=${encodeURIComponent(CONFIG.API_VERSION)}`;
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json", "Accept": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    throw new Error("Couldn't reach the Fabric endpoint. If you're running this page from your own server, the browser may be blocking the request (CORS). See the setup notes for using a small proxy.");
  }
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.error?.message || j.message || JSON.stringify(j); } catch {}
    const msg = res.status === 401 || res.status === 403
      ? `Fabric refused access (${res.status}). Check that your account can use this data agent and that the app registration has the right API permissions.`
      : `Fabric returned an error (${res.status}).`;
    const err = new Error(detail ? `${msg} ${detail}` : msg);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* Pull generated SQL / DAX / KQL out of the run's tool-call steps */
function extractQueries(steps) {
  const out = [];
  const seen = new Set();
  for (const s of steps) {
    for (const call of (s.step_details?.tool_calls || [])) {
      const f = call.function || call[call.type] || {};
      const found = [];
      collectQueries(tryJson(f.arguments), found, "");
      collectQueries(tryJson(f.output), found, "");
      for (let q of found) {
        q = q.replace(/^```\w*\n?|```$/g, "").trim();
        if (q && !seen.has(q)) { seen.add(q); out.push({ lang: detectLang(q), code: q }); }
      }
    }
  }
  return out;
}
function collectQueries(v, acc, key) {
  if (v == null) return;
  if (typeof v === "string") {
    const parsed = tryJson(v);
    if (parsed !== v && typeof parsed === "object") return collectQueries(parsed, acc, key);
    if (looksLikeQuery(v) || (/(^sql$|^dax$|^kql$|^code$|generated_?code|query_?code)/i.test(key) && v.length > 10)) acc.push(v);
    return;
  }
  if (Array.isArray(v)) return v.forEach(x => collectQueries(x, acc, key));
  if (typeof v === "object") for (const [k, x] of Object.entries(v)) collectQueries(x, acc, k);
}
function looksLikeQuery(s) {
  const t = s.replace(/^```\w*\n?/, "").trim();
  return /^(select|with)\s/i.test(t) || /^(evaluate|define)\b/i.test(t) || /\n\s*\|\s*(where|summarize|project|extend|take|top)\b/.test(t);
}
function detectLang(s) {
  if (/^\s*(evaluate|define)\b/i.test(s)) return "DAX";
  if (/^\s*(select|with)\s/i.test(s)) return "SQL";
  if (/\|\s*(where|summarize|project|extend|take|top)\b/.test(s)) return "KQL";
  return "generated";
}
function tryJson(v) {
  if (typeof v !== "string") return v;
  try { return JSON.parse(v); } catch { return v; }
}

/* ---------- Authentication (MSAL) ---------- */
async function initAuth() {
  if (CONFIG.DEMO_MODE) return;
  if (!window.msal) { showBanner("The Microsoft sign-in library didn't load. Check your network connection and reload the page."); return; }
  msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: `https://login.microsoftonline.com/${CONFIG.TENANT_ID}`,
      redirectUri: CONFIG.REDIRECT_URI || (location.origin + location.pathname)
    },
    cache: { cacheLocation: "sessionStorage" }
  });
  if (msalApp.initialize) await msalApp.initialize();
  await msalApp.handleRedirectPromise();
  account = msalApp.getAllAccounts()[0] || null;
}
async function signIn() {
  if (!msalApp) throw new Error("Sign-in isn't configured. Add your CLIENT_ID and TENANT_ID in the CONFIG section.");
  const r = await msalApp.loginPopup({ scopes: CONFIG.SCOPES });
  account = r.account;
  renderAccount();
}
async function signOut() {
  if (!msalApp || !account) return;
  await msalApp.logoutPopup({ account });
  account = null; assistantId = null;
  renderAccount();
}
async function getToken() {
  if (!account) await signIn();
  try {
    return (await msalApp.acquireTokenSilent({ scopes: CONFIG.SCOPES, account })).accessToken;
  } catch {
    return (await msalApp.acquireTokenPopup({ scopes: CONFIG.SCOPES, account })).accessToken;
  }
}

/* ---------- Demo answers ---------- */
async function demoAnswer(q) {
  setThinking("Querying your data…");
  await sleep(1400);
  const s = q.toLowerCase();
  if (s.includes("no-show") || s.includes("clinic")) {
    return {
      text: `Eastside Family Medicine has the highest no-show rate this year at **14.2%**, about 4 points above the network average of 10.1%.

| Clinic | Scheduled | No-shows | No-show rate (%) |
|---|---|---|---|
| Eastside Family Medicine | 8,412 | 1,194 | 14.2 |
| Riverbend Pediatrics | 6,105 | 739 | 12.1 |
| North Campus Internal Med | 9,870 | 958 | 9.7 |
| Lakeview Women's Health | 5,233 | 471 | 9.0 |
| Westgate Cardiology | 3,980 | 251 | 6.3 |

Afternoon appointments account for most of the gap at Eastside.`,
      queries: [{ lang: "SQL", code: `SELECT c.clinic_name,
       COUNT(*)                                   AS scheduled,
       SUM(CASE WHEN a.status = 'NO_SHOW' THEN 1 ELSE 0 END) AS no_shows,
       ROUND(100.0 * SUM(CASE WHEN a.status = 'NO_SHOW' THEN 1 ELSE 0 END) / COUNT(*), 1) AS no_show_rate
FROM   dbo.appointments a
JOIN   dbo.clinics c ON c.clinic_id = a.clinic_id
WHERE  YEAR(a.appointment_date) = YEAR(GETDATE())
GROUP  BY c.clinic_name
ORDER  BY no_show_rate DESC;` }]
    };
  }
  return {
    text: `Patient visits are up **8.6%** year to date compared with the same period last year. September was the busiest month so far.

| Month | Visits 2026 | Visits 2025 |
|---|---|---|
| Jan 2026 | 18,240 | 17,105 |
| Feb 2026 | 17,388 | 16,422 |
| Mar 2026 | 19,915 | 18,030 |
| Apr 2026 | 19,102 | 17,640 |
| May 2026 | 19,470 | 18,215 |
| Jun 2026 | 18,655 | 17,330 |
| Jul 2026 | 18,120 | 16,980 |
| Aug 2026 | 20,034 | 18,422 |
| Sep 2026 | 20,811 | 19,006 |

Switch to **Chart** above to see the trend.`,
    queries: [{ lang: "DAX", code: `EVALUATE
SUMMARIZECOLUMNS (
    'Date'[Month Year],
    "Visits 2026", CALCULATE ( [Total Visits], 'Date'[Year] = 2026 ),
    "Visits 2025", CALCULATE ( [Total Visits], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )
)
ORDER BY 'Date'[Month Year]` }]
  };
}

/* ---------- Utilities ---------- */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function scrollDown() { const s = $("scroll"); s.scrollTop = s.scrollHeight; }
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
function showBanner(msg) {
  const b = document.createElement("div");
  b.className = "banner"; b.setAttribute("role", "alert"); b.textContent = msg;
  $("bannerSlot").replaceChildren(b);
}

/* ---------- Wire up ---------- */
$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("newChat").onclick = newChat;
$("menuBtn").onclick = openNav;
$("scrim").onclick = closeNav;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });

(async function start() {
  if (!CONFIG.DEMO_MODE && (CONFIG.AGENT_URL.startsWith("PASTE") || CONFIG.CLIENT_ID.startsWith("PASTE"))) {
    showBanner("Add your published agent URL, client ID and tenant ID in the CONFIG section, or set DEMO_MODE to true.");
  }
  try { await initAuth(); } catch (e) { showBanner(`Sign-in setup failed: ${e.message}`); }
  renderAccount();
  renderHistory();
  renderThread();
})();
</script>
